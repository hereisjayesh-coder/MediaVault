org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Disabled: the Chaquopy plugin (used by core:extractor-ytdlp) is not yet
# configuration-cache compatible as of 17.0.0 — it starts an external Python process
# at configuration time and stores non-serializable task state.
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
